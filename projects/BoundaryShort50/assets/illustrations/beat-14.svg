<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1530" viewBox="0 0 1080 1530"><defs><pattern id="paper" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="4" cy="8" r="1" fill="#172538" opacity=".065"/></pattern></defs><rect width="1080" height="1530" fill="#f3eddc"/><rect width="1080" height="1530" fill="url(#paper)"/><style>text{font-family:Korean,sans-serif}path{stroke-linejoin:round;stroke-linecap:round}</style><rect x="133" y="438" width="814" height="832" rx="44" fill="#f3eddc" stroke="#172538" stroke-width="6"/><text x="540" y="530" font-size="49" fill="#172538" text-anchor="middle" font-weight="800">도울 수 있는 만큼만</text><g id="ten-clock"><circle cx="540" cy="855" r="230" fill="#e5ff3e" stroke="#172538" stroke-width="9"/><path d="M540 655v48M733 745l-39 24M733 965l-39-24M540 1055v-48M347 965l39-24M347 745l39 24" stroke="#172538" stroke-width="11" fill="none" stroke-linecap="round"/></g><text x="540" y="886" font-size="100" fill="#172538" text-anchor="middle" font-weight="800">10분</text><text x="540" y="1194" font-size="33" fill="#172538" text-anchor="middle" font-weight="800">“전부는 어렵고, 이만큼은 가능해.”</text><text x="540" y="1390" font-size="34" fill="#172538" text-anchor="middle" font-weight="800">도울 마음과 여유가 있을 때만</text></svg>