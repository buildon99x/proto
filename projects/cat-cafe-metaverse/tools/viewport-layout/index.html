<!doctype html><meta charset="utf-8"><title>Cat café layout verification</title><style>body{font-family:system-ui;margin:12px;background:#ddd}button,select{padding:10px;margin:4px}iframe{display:block;border:2px solid #444;background:white}pre{font-size:12px;white-space:pre-wrap}</style><h1>Viewport-layout test (not physical mobile hardware)</h1><label>Revision <select id="revision"><option>after</option></select></label><button data-size="320,568">320×568</button><button data-size="390,844">390×844</button><button data-size="568,320">568×320</button><button data-size="844,390">844×390</button><button data-size="768,1024">768×1024</button><button id="measure">Measure visible layout</button><iframe id="view" title="Cafe viewport" width="320" height="568" src="after/index.html"></iframe><pre id="metrics">Click solo preview inside the frame, then measure.</pre><script>
const frame=document.querySelector('#view');document.querySelector('#revision').onchange=e=>frame.src=e.target.value+'/index.html';document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{const[w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;});document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument;const rect=s=>{const e=d.querySelector(s),r=e.getBoundingClientRect(),c=getComputedStyle(e);return{selector:s,x:r.x,y:r.y,w:r.width,h:r.height,visible:c.display!=='none'&&c.visibility!=='hidden'&&r.width>0&&r.height>0}};const a=rect('#joystick'),b=rect('#cat-card'),h=rect('header'),rooms=rect('#rooms'),f=rect('footer'),n=rect('#notice');const overlaps=(a,b)=>a.visible&&b.visible&&Math.min(a.x+a.w,b.x+b.w)>Math.max(a.x,b.x)&&Math.min(a.y+a.h,b.y+b.h)>Math.max(a.y,b.y);document.querySelector('#metrics').textContent=JSON.stringify({revision:document.querySelector('#revision').value,viewport:[frame.width,frame.height],joystickCardOverlap:overlaps(a,b),headerRoomsOverlap:overlaps(h,rooms),joystickFooterOverlap:overlaps(a,f),noticeRoomsOverlap:overlaps(n,rooms),noticeCardOverlap:overlaps(n,b),noticeWithinViewport:n.y>=0&&n.y+n.h<=Number(frame.height),rects:['#joystick','#cat-card','#notice','header','#rooms','footer','#help','#leave','#nearest','#position-toggle','[data-action="pet"]'].map(rect)},null,2);};
</script>
