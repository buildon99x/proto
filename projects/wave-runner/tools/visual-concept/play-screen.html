<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Wave Runner — 실크스크린 컨셉 · 플레이</title>
<link rel="stylesheet" href="common.css">
<style>
/* ── 자외선 세트 — 진한 퍼플 종이에 형광 라임 아바타 ──────────────
 *
 * 형광 잉크는 실크스크린에서만 찍히는 잉크다(오프셋으로는 못 낸다). 그래서
 * 형광 라임은 컨셉을 배신하는 게 아니라 오히려 이 공정을 증명하는 색이다.
 *
 * 다만 두 색 다 게임이 이미 쓰고 있어 **대가가 있다.**
 *   · 라임 #b8ff5e 는 홀드 표시, 민트 #7dffb0 는 종료선이다 → 아바타가 라임이 되면
 *     둘은 비켜야 한다(홀드는 연보라, 종료선은 잉크를 비운 종이 띠로).
 *   · 퍼플 바탕은 편향 축 #e07bff 와 같은 계열이다 → 게이트 핀에 종이색 링을
 *     둘러 바탕에서 떼어 낸다.
 * 자세한 것은 notes/visual-concept-silkscreen.md 의 "자외선 세트의 대가". */
:root {
  --stock: #2a1b47;
  --ink: #0d0518;
  /* 형광 라임은 이제 **경계 일대**와 배경 심볼을 함께 맡는다.
   * 판정선 · 어긋난 판 · 게이트 렌즈 윤곽 — 통로를 오려 낸 자리 전부가 라임이다.
   * 아바타와 게이트 표식은 게임 값 그대로다. */
  --edge: #ccff33;        /* 판정선 = 형광 라임 */
  --mark: #ccff33;        /* 배경 심볼도 같은 잉크. 대신 잉크를 훨씬 얇게 올린다 */
  --brand: #ffe66d;       /* 아바타 — 게임 값 */

  /* 아바타가 경계선에 닿는 순간 노랑과 라임이 붙어 보이면 안 된다.
   * 아바타 밑에 먹을 한 겹 깔아 떼어 놓는다 — 인쇄의 녹아웃이다. */
  --knockout: #0d0518;

  --screen-line: #26123f;
  --screen-line-2: #1e0f34;
  --dot: #8f74d6;

  --scn-far: #1c1133;
  --scn-mid: #160d2a;
  --scn-near: #0a0417;
  --scn-moon: #221540;
  --scn-key: #583f93;
  --scn-key-faint: #3b2a66;
  --scn-window: #0d0518;

  --ghost: #ccff33;   /* 어긋난 판도 같은 라임. 잉크를 얇게 올려 선과 구분된다 */
  --grain-tint: #3a2168;
  --hud: #b9a8e6;
  --hud-dim: #7a68a8;
  --rail-bg: #1a0f2e;
  --rail-fill: #8f74d6;
}

/* 플레이 화면에는 전역 종이 결이 없다.
 * 결은 잉크(벽) 위에만 얹고 통로는 평평한 종이로 비워 둔다 — 컨셉의 1번 규칙이다. */
.stage { position: absolute; inset: 0; background: var(--ink); }
svg.field { display: block; width: 780px; height: 1440px; }

.hud {
  position: absolute; left: 22px; top: 22px;
  display: flex; align-items: center; gap: 11px;
  z-index: 40;
}
.hud .cross { width: 15px; height: 15px; opacity: 0.5; }
.hud .val { font-size: 15px; font-weight: 700; color: var(--hud); letter-spacing: 0.02em; }
.hud .val em { font-style: normal; color: var(--hud-dim); margin-left: 6px; font-size: 12px; }

/* 진행 레일 — 맨 위 3px. 통로를 훑는 시선 경로 밖 */
.rail { position: absolute; left: 0; top: 0; height: 3px; width: 100%; background: var(--rail-bg); z-index: 41; }
.rail b { display: block; height: 3px; width: 38%; background: var(--rail-fill); }

.foot { position: absolute; left: 22px; bottom: 52px; z-index: 40; }
</style>
</head>
<body>
<div class="stage">
  <svg class="field" id="field" viewBox="0 0 780 1440"></svg>
</div>

<div class="rail"><b></b></div>
<div class="hud">
  <svg class="cross" viewBox="0 0 16 16"><path d="M8 0v16M0 8h16" stroke="#9fb4d8" stroke-width="1"/></svg>
  <div class="val">14.2초 <em>· 642m</em></div>
</div>
<div class="foot"><span class="slug">티어 3-2 · 협곡 3 → 회랑 상승 2</span></div>

<svg class="reg br" viewBox="0 0 26 26"><path d="M13 0v26M0 13h26" stroke="#9fb4d8" stroke-width="1"/><circle cx="13" cy="13" r="6" fill="none" stroke="#9fb4d8" stroke-width="1"/></svg>

<script src="defs.js"></script>
<script src="scenery.js"></script>
<script>
(() => {
  const W = 780, H = 1440;

  // ── 코스 기하 — 협곡. 램프와 평탄한 회복 구간이 번갈아 온다 ──
  const KEY = [
    { x: 0,   c: 800, half: 190 },
    { x: 120, c: 800, half: 190 },
    { x: 205, c: 700, half: 175 },
    { x: 320, c: 700, half: 175 },
    { x: 405, c: 610, half: 160 },
    { x: 540, c: 610, half: 160 },
    { x: 620, c: 545, half: 150 },
    { x: 780, c: 545, half: 150 }
  ];
  const lin = (side) => KEY.map((k) => `${k.x},${(k.c + side * k.half).toFixed(1)}`).join(" L ");
  const topPath = `M ${lin(-1)}`;
  const botPath = `M ${lin(1)}`;
  // 벽은 레터박스까지 덮는다 — 화면 위아래 남는 띠도 "갈 수 없는 곳"으로 같이 읽힌다
  const wallTop = `${topPath} L ${W},0 L 0,0 Z`;
  const wallBot = `${botPath} L ${W},${H} L 0,${H} Z`;

  // ── 아바타 — 실제 45°. 꺾인 점은 전부 통로 안이다 ──
  // 오래 누르고 짧게 놓는 비대칭 탭이 상승을 합성한다 — 회랑에서 쓰는 바로 그 손놀림
  const trail = "-40,900 80,780 125,825 245,705 290,750 410,630";
  const head = "410,630";

  // ── 게이트 — 통로를 두 갈래로 가르는 렌즈 ──
  const gy = 545, gh = 150;
  const gate = `M 585,${gy} C 640,${gy - 30} 700,${gy - 30} 752,${gy - 24}
                L 752,${gy + 24} C 700,${gy + 30} 640,${gy + 30} 585,${gy} Z`;
  const laneUp = gy - gh / 2 - 8;   // 위 갈래의 중앙
  const laneDn = gy + gh / 2 + 8;   // 아래 갈래의 중앙

  /* 게이트는 손대지 않는다 — 화살표 청록도, 핀 색도, 링 없는 것도 게임 그대로다.
   * 퍼플 바탕에서 편향 핀(#e07bff)이 계열상 가까운 것은 맞지만 명도 차가 크고
   * 뒤에 먹 렌즈가 깔려 있어 녹지 않는다. 실기에서 다시 볼 항목으로만 남긴다. */
  const pill = (cx, cy, color) => `
    <path d="M${cx},${cy - 46} l18,26 h-11 v18 h-14 v-18 h-11 Z" fill="#2c6b78"/>
    <rect x="${cx - 44}" y="${cy - 16}" width="88" height="34" rx="5" fill="${color}"/>
    <rect x="${cx - 44}" y="${cy - 16}" width="88" height="34" rx="5" fill="url(#tone-1)" opacity="0.28"/>`;

  document.getElementById("field").innerHTML = `
    <defs>
      <clipPath id="wall-only">
        <path d="${wallTop}"/>
        <path d="${wallBot}"/>
      </clipPath>
      <!-- 침묵 띠 — 통로 경계 안쪽 75px 에는 배경이 한 점도 들어오지 않는다.
           경계선은 시선이 제일 먼저 잡는 선이고, 거기서 실루엣과 경쟁하면
           배경이 이기는 순간 코스가 안 읽힌다. 인쇄로 치면 녹아웃 여백이다 -->
      <mask id="scenery-area">
        <rect width="${W}" height="${H}" fill="#fff"/>
        <path d="${topPath}" fill="none" stroke="#000" stroke-width="150"/>
        <path d="${botPath}" fill="none" stroke="#000" stroke-width="150"/>
      </mask>
    </defs>

    <!-- 1. 종이 — 통로. 평평하다. 결도 망점도 없다 -->
    <rect width="${W}" height="${H}" style="fill:var(--stock)"/>

    <!-- 2. 먹판 — 벽. 통로보다 어둡다(명도가 의미를 따른다).
         결과 망점은 전부 이 안쪽에만 있다 -->
    <path d="${wallTop}" style="fill:var(--ink)"/>
    <path d="${wallBot}" style="fill:var(--ink)"/>
    <!-- 2b. 선망과 종이 결 — 벽 전체를 한 판으로 묶는다 -->
    <g clip-path="url(#wall-only)">
      <rect width="${W}" height="${H}" fill="url(#plate-gorge)" opacity="0.5"/>
      <rect width="${W}" height="${H}" style="fill:var(--grain-tint)" opacity="0.5" filter="url(#paper)"/>
    </g>

    <!-- 2c. 배경 실루엣 — 계곡·폐허·무너진 도시·달·마른 나무.
         선망 위에 얹은 두 번째 판이다. 전부 벽 잉크 안에서만 살고,
         어느 하나도 통로 종이보다 밝지 않다 — 밝은 것은 1px 윤곽선뿐이다 -->
    <g clip-path="url(#wall-only)" mask="url(#scenery-area)">
      ${moon(178, 232, 88)}
      ${ridgePair(-40, 520, 436, 5, 17)}
      ${ridgePair(300, 880, 378, 6, 91)}
      ${skyline(300, 392, 11, 5)}
      ${deadTree(92, 336, 1.3, 23)}
      ${deadTree(250, 300, 0.85, 71)}
      ${emblem(636, 208, 34)}
      ${beacon(470, 180, 104)}

      ${ridgePair(-40, 520, 1404, 4, 41)}
      ${ruins(64, 1296, 13)}
      ${skyline(436, 1308, 8, 29)}
      ${deadTree(372, 1296, 1.55, 7)}
      ${deadTree(700, 1274, 1.15, 53)}
      ${stencil(92, 1214, 0)}
      ${stencil(158, 1226, 1)}
      ${stencil(246, 1238, 2)}
    </g>

    <!-- 3. 어긋난 판 — 오직 벽 안쪽으로만 밀린다.
         판정선을 절대 넘지 않으므로 어긋남은 나를 살리는 쪽으로만 틀린다 -->
    <g clip-path="url(#wall-only)" opacity="0.28" filter="url(#rough)">
      <path d="${topPath}" transform="translate(3,-9)" fill="none" style="stroke:var(--ghost)" stroke-width="9"/>
      <path d="${botPath}" transform="translate(3,9)"  fill="none" style="stroke:var(--ghost)" stroke-width="9"/>
    </g>

    <!-- 4. 판정선 — 화면에서 유일하게 떨리지 않는 선.
         잉크를 0.86 으로 올려 아바타보다 한 단계 아래에 둔다. 전체 강도로 찍으면
         노랑 아바타와 밝기가 같아져 둘을 가르는 것이 색상각 15° 뿐이 되는데,
         그 15° 가 필요한 순간은 하필 아바타가 선에 닿기 직전이다. -->
    <g opacity="0.86">
      <path d="${topPath}" fill="none" style="stroke:var(--edge)" stroke-width="2.6" stroke-linejoin="miter"/>
      <path d="${botPath}" fill="none" style="stroke:var(--edge)" stroke-width="2.6" stroke-linejoin="miter"/>
    </g>

    <!-- 5. 게이트 렌즈 — 벽과 같은 먹판이다 -->
    <path d="${gate}" style="fill:var(--ink)"/>
    <path d="${gate}" fill="url(#plate-corridor)" opacity="0.7"/>
    <path d="${gate}" fill="none" style="stroke:var(--edge)" stroke-width="2.4" opacity="0.86"/>

    <!-- 6. 게이트 표식 — 속도 +1 / 편향 +1. 색은 axes.ts 의 값 그대로 -->
    ${pill(676, laneUp, "#ffb347")}
    ${pill(676, laneDn, "#e07bff")}

    <!-- 7. 아바타 잉크 — 화면에서 유일하게 노란 것 -->
    <polyline points="${trail}" fill="none" style="stroke:var(--knockout)" stroke-width="6" opacity="0.32"/>
    <polyline points="290,750 ${head}" fill="none" style="stroke:var(--knockout)" stroke-width="10.5"/>
    <path d="M${head} l34,-24 -8,30 -12,-8 Z" style="fill:var(--knockout);stroke:var(--knockout)" stroke-width="5" stroke-linejoin="round"/>
    <polyline points="${trail}" fill="none" style="stroke:var(--brand)" stroke-width="3.2" opacity="0.3"/>
    <polyline points="290,750 ${head}" fill="none" style="stroke:var(--brand)" stroke-width="5.4"/>
    <path d="M${head} l34,-24 -8,30 -12,-8 Z" style="fill:var(--brand)"/>
  `;
})();
</script>
</body>
</html>
