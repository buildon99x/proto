<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f6f6f2; --surface:#fcfcfb; --ink:#141517; --ink2:#4d5054; --muted:#83857f;
  --grid:#e2e2dc; --axis:#c4c4bc; --ring:rgba(20,21,23,.10);
  --before:#8b8a83; --before-soft:#d9d8d2; --after:#2a78d6; --after-soft:#b7d3f6;
  --good:#0ca30c; --good-ink:#006300; --bad:#d03b3b; --target:#141517;
  --tip-bg:#141517; --tip-ink:#fcfcfb;
  --font: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f100f; --surface:#1a1a19; --ink:#f3f3ef; --ink2:#c3c2b7; --muted:#8c8b84;
    --grid:#2c2c2a; --axis:#3d3d39; --ring:rgba(255,255,255,.10);
    --before:#77756e; --before-soft:#3a3935; --after:#3987e5; --after-soft:#1f3f66;
    --good:#0ca30c; --good-ink:#35c235; --bad:#e66767; --target:#f3f3ef;
    --tip-bg:#f3f3ef; --tip-ink:#141517;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f100f; --surface:#1a1a19; --ink:#f3f3ef; --ink2:#c3c2b7; --muted:#8c8b84;
  --grid:#2c2c2a; --axis:#3d3d39; --ring:rgba(255,255,255,.10);
  --before:#77756e; --before-soft:#3a3935; --after:#3987e5; --after-soft:#1f3f66;
  --good:#0ca30c; --good-ink:#35c235; --bad:#e66767; --target:#f3f3ef;
  --tip-bg:#f3f3ef; --tip-ink:#141517;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.65;margin:0}
.wrap{max-width:940px;margin:0 auto;padding-inline:20px;padding-block:40px 72px;display:flex;flex-direction:column;gap:56px}
header{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-size:clamp(26px,4.4vw,38px);line-height:1.25;margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h1 .from{color:var(--before)} h1 .to{color:var(--after)}
.lede{font-size:16px;color:var(--ink2);max-width:66ch;margin:0}
.lede b{color:var(--ink);font-weight:600}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
.meta code{font-family:inherit;color:var(--ink2)}
h2{font-size:20px;margin:0;font-weight:700;text-wrap:balance}
section{display:flex;flex-direction:column;gap:14px}
.sub{color:var(--ink2);margin:0;max-width:68ch}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.tile .k{font-size:12.5px;color:var(--ink2);font-weight:500}
.tile .v{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tile .old{font-size:15px;color:var(--before);text-decoration:line-through;text-decoration-thickness:1px}
.tile .arrow{color:var(--muted);font-size:13px}
.tile .new{font-size:26px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.tile .note{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:18px 18px 12px}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:max(100%, 720px);height:auto}
.legend{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.sq{border-radius:2px}
svg text{fill:var(--ink2);font-family:var(--font);font-size:12px}
svg .tick text{fill:var(--muted);font-variant-numeric:tabular-nums;font-size:11px}
svg .gridline{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .lane{stroke:var(--grid);stroke-width:1}
svg .panel-title{fill:var(--ink);font-weight:600;font-size:13px}
svg .strong{fill:var(--ink);font-weight:600}
svg [data-tip]{cursor:default}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.split{grid-template-columns:1fr}}
.split .chart svg{width:100%}
.seg{display:inline-flex;border:1px solid var(--ring);border-radius:8px;padding:3px;gap:3px;background:var(--surface);align-self:flex-start}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink2);padding:6px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.seg button:focus-visible{outline:2px solid var(--after);outline-offset:2px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--ring);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.was{color:var(--before)}
tbody tr:last-child td{border-bottom:0}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px}
.verdict.ok{color:var(--good-ink)} .verdict.no{color:var(--bad)}
.verdict b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px}
.verdict.ok b{background:var(--good)} .verdict.no b{background:var(--bad)}
.tnote{font-size:12.5px;color:var(--muted);margin:0}
.cost{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.cost{grid-template-columns:1fr}}
.cost .tile .new{font-size:22px}
.method{font-size:13.5px;color:var(--ink2)}
.method ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.method code{font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--ink)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.shots{grid-template-columns:1fr}}
.shots figure{margin:0;background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.shots img{display:block;width:100%;height:auto;border-radius:6px;border:1px solid var(--ring)}
.shots figcaption{font-size:12.5px;color:var(--ink2)}
.shots figcaption b{color:var(--ink)}
.suite{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--ring);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink2)}
.suite .verdict{font-size:13.5px}
.sub code{font-size:13px;background:var(--surface);padding:1px 5px;border-radius:4px;color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);font-size:12.5px;line-height:1.45;padding:7px 10px;border-radius:6px;max-width:260px;z-index:10;transform:translate(-50%,calc(-100% - 12px))}
@media (prefers-reduced-motion:no-preference){ .tile,.card{transition:border-color .15s} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="meta" id="meta"></div>
  </header>

  <section aria-labelledby="s-tiles">
    <h2 id="s-tiles" hidden>핵심 수치</h2>
    <div class="tiles" id="tiles"></div>
  </section>

  <section aria-labelledby="s-lanes">
    <h2 id="s-lanes">첫 10분에 무슨 일이 일어나는가</h2>
    <p class="sub" id="n-lanes"></p>
    <div class="card">
      <div class="legend"><span><i style="background:var(--before)"></i><span class="bl"></span></span><span><i style="background:var(--after)"></i><span class="al"></span></span></div>
      <div class="chart" id="lanes"></div>
    </div>
  </section>

  <section aria-labelledby="s-reach">
    <h2 id="s-reach">긴장 장치에 처음 닿는 시각</h2>
    <p class="sub" id="n-reach"></p>
    <div class="card">
      <div class="legend"><span><i style="background:var(--before)"></i><span class="bl"></span></span><span><i style="background:var(--after)"></i><span class="al"></span></span><span><i class="sq" style="background:var(--target);width:2px;border-radius:0"></i>목표</span></div>
      <div class="chart" id="reach"></div>
    </div>
  </section>

  <section aria-labelledby="s-ui">
    <h2 id="s-ui">실제 앱에서 재도 같다</h2>
    <p class="sub" id="n-ui-sub"></p>
    <div class="card">
      <div class="legend"><span><i style="background:var(--before)"></i><span class="bl"></span></span><span><i style="background:var(--after)"></i><span class="al"></span></span><span><i class="sq" style="background:var(--target);width:2px;border-radius:0"></i>첫 세션 예산 10분</span></div>
      <div class="chart" id="ui"></div>
    </div>
    <p class="tnote" id="ui-note"></p>
    <div class="shots">
      <figure><img id="shot-before" alt="기준 버전에서 첫 제보 배너가 처음 보인 화면"><figcaption id="cap-before"></figcaption></figure>
      <figure><img id="shot-after" alt="비교 버전에서 첫 제보 배너가 처음 보인 화면"><figcaption id="cap-after"></figcaption></figure>
    </div>
    <div class="suite" id="suite"></div>
  </section>

  <section aria-labelledby="s-ratio">
    <h2 id="s-ratio">반복 대 의미, 30초마다</h2>
    <p class="sub" id="n-ratio"></p>
    <div class="split">
      <div class="card"><div class="chart" id="ratio-before"></div></div>
      <div class="card"><div class="chart" id="ratio-after"></div></div>
    </div>
    <div class="legend"><span><i class="sq" style="background:var(--ink2)"></i>의미 있는 사건(위)</span><span><i class="sq" style="background:var(--before-soft)"></i>반복 사건(아래)</span></div>
  </section>

  <section aria-labelledby="s-ledger">
    <h2 id="s-ledger">원장 14축 — 판정은 최악 시드 기준</h2>
    <div class="seg" role="group" aria-label="플레이 방식">
      <button type="button" id="mode-active" aria-pressed="true">운영 플레이</button>
      <button type="button" id="mode-idle" aria-pressed="false">탭만 열어 둔 플레이</button>
    </div>
    <div class="tablewrap"><table id="ledger"></table></div>
    <p class="tnote" id="ledger-note"></p>
  </section>

  <section aria-labelledby="s-cost">
    <h2 id="s-cost">치른 값</h2>
    <p class="sub" id="n-cost"></p>
    <div class="cost" id="cost"></div>
  </section>

  <section aria-labelledby="s-method" class="method">
    <h2 id="s-method">어떻게 쟀나</h2>
    <ul id="method"></ul>
  </section>
</div>
<div id="tip" hidden></div>

<script>
const D = __DATA__;
window.__UI = __UI__;
const META = __META__;
const NARR = __NARR__;
const BL = META.beforeLabel, AL = META.afterLabel;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function fmt(s) {
  if (s == null) return "도달 못 함";
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
  if (h) return `${h}시간 ${m}분`;
  if (m) return x ? `${m}분 ${x}초` : `${m}분`;
  return `${x}초`;
}
const L = (ver, mode) => D.ledger[ver][mode];
const val = (ver, i, col) => L(ver, "active")[i][col];

// ── 머리말 ──
document.querySelectorAll(".bl").forEach(e => e.textContent = BL);
document.querySelectorAll(".al").forEach(e => e.textContent = AL);
$("eyebrow").textContent = `유물왕 · 밀도 원장 · ${META.seeds}시드 실측`;
$("h1").innerHTML = NARR.h1;
$("lede").innerHTML = NARR.lede;
$("meta").innerHTML = `<span>비교: <code>${BL}</code> (${META.beforeRef}) ↔ <code>${AL}</code> (${META.afterRef})</span>` +
  `<span>자: <code>pnpm density --seeds ${META.seeds}</code> · <code>pnpm play</code></span><span>측정일 ${META.date}</span>`;
for (const [id, key] of [["lanes", "lanes"], ["reach", "reach"], ["ui-sub", "uiSub"], ["ratio", "ratio"], ["cost", "cost"]]) $("n-" + id).innerHTML = NARR[key] || "";

// ── 수치 타일 ──
const tiles = [
  { k: "첫 제보", old: val("before", 9, 3), now: val("after", 9, 3), note: "긴장 장치의 유일한 입구" },
  { k: "첫 10분 사건 종류", old: val("before", 1, 3), now: val("after", 1, 3), note: `첫 1분은 ${val("before", 0, 3)} → ${val("after", 0, 3)}` },
  { k: "반복 : 의미 (첫 10분)", old: val("before", 8, 3), now: val("after", 8, 3), note: "목표 1.5 : 1 이하" },
  { k: "첫 10분 긴장 사건", old: val("before", 5, 3), now: val("after", 5, 3), note: `승 ${val("after", 6, 3)} · 패 ${val("after", 7, 3)} (중앙)` },
];
$("tiles").innerHTML = tiles.map(t => `
  <div class="tile"><div class="k">${t.k}</div>
  <div class="v"><span class="old">${t.old}</span><span class="arrow">→</span><span class="new">${t.now}</span></div>
  <div class="note">${t.note}</div></div>`).join("");

// ── 툴팁 ──
const tip = $("tip");
document.addEventListener("pointermove", (ev) => {
  const t = ev.target.closest && ev.target.closest("[data-tip]");
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.getAttribute("data-tip");
  tip.style.left = ev.clientX + "px"; tip.style.top = ev.clientY + "px";
  tip.hidden = false;
});
document.addEventListener("pointerleave", () => tip.hidden = true);

// ── 사건 레인 ──
(function lanes() {
  const order = [];
  for (const ver of ["after", "before"]) for (const e of D.lanes[ver].events) if (!order.includes(e.k)) order.push(e.k);
  const W = 900, left = 104, right = 18, laneH = 19, gap = 34, axisH = 26, titleH = 22;
  const panelH = titleH + order.length * laneH;
  const H = panelH * 2 + gap + axisH + 6;
  const x = (t) => left + (t / 600) * (W - left - right);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "첫 10분 사건 레인 비교" });
  [["before", 0], ["after", panelH + gap]].forEach(([ver, y0]) => {
    const d = D.lanes[ver];
    const color = ver === "after" ? "var(--after)" : "var(--before)";
    const t = el("text", { x: 0, y: y0 + 14, class: "panel-title" }, svg);
    t.textContent = (ver === "after" ? AL : BL) + ` · 시드 ${d.seed} — 첫 10분 ${d.kinds10m}종, 반복:의미 ${d.ratio.toFixed(2)} : 1`;
    for (let m = 0; m <= 10; m++) el("line", { x1: x(m * 60), x2: x(m * 60), y1: y0 + titleH, y2: y0 + panelH, class: "gridline" }, svg);
    order.forEach((k, i) => {
      const cy = y0 + titleH + i * laneH + laneH / 2;
      el("line", { x1: left, x2: W - right, y1: cy, y2: cy, class: "lane" }, svg);
      const lab = el("text", { x: left - 10, y: cy + 4, "text-anchor": "end" }, svg);
      lab.textContent = D.ko[k] || k;
      const evs = d.events.filter(e => e.k === k);
      if (!evs.length) {
        const n = el("text", { x: left + 6, y: cy + 4, style: "fill:var(--muted);font-size:11px" }, svg);
        n.textContent = ver === "before" ? "—" : "";
      }
      for (const e of evs) {
        el("circle", { cx: x(e.t), cy, r: 4.5, fill: color, stroke: "var(--surface)", "stroke-width": 2,
          "data-tip": `${ver === "after" ? AL : BL} · ${D.ko[k]} · ${fmt(e.t)}${e.n > 1 ? ` (${e.n}건)` : ""}` }, svg);
      }
    });
  });
  const ay = panelH * 2 + gap + 2;
  el("line", { x1: left, x2: W - right, y1: ay, y2: ay, class: "axis" }, svg);
  const g = el("g", { class: "tick" }, svg);
  for (let m = 0; m <= 10; m++) {
    const tx = el("text", { x: x(m * 60), y: ay + 17, "text-anchor": m === 0 ? "start" : m === 10 ? "end" : "middle" }, g);
    tx.textContent = m === 0 ? "0" : `${m}분`;
  }
  $("lanes").appendChild(svg);
})();

// ── 첫 도달 시각(로그 눈금) ──
(function reach() {
  const rows = [
    { key: "firstTip", name: "첫 제보", target: 60, targetLabel: "≤60초" },
    { key: "firstRaceResult", name: "첫 레이스 결과", target: 120, targetLabel: "≤2분" },
    { key: "firstT4Encounter", name: "첫 유일(T4) 조우", target: 600, targetLabel: "≤10분", rec: (META.recorded || {}).firstT4Encounter },
    { key: "firstSiteUnlock", name: "첫 거점 해금", target: 600, targetLabel: "≤10분", rec: (META.recorded || {}).firstSiteUnlock },
  ];
  const W = 900, left = 132, right = 96, rowH = 62, top = 34, axisH = 30;
  const H = top + rows.length * rowH + axisH;
  const lo = Math.log10(10), hi = Math.log10(3600);
  const x = (s) => left + (Math.log10(s) - lo) / (hi - lo) * (W - left - right);
  const over = W - right + 44;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "첫 도달 시각 비교" });
  const ticks = [10, 30, 60, 120, 300, 600, 1200, 1800, 3600];
  for (const t of ticks) el("line", { x1: x(t), x2: x(t), y1: top, y2: top + rows.length * rowH, class: "gridline" }, svg);
  el("rect", { x: W - right + 14, y: top, width: 60, height: rows.length * rowH, fill: "var(--bg)", rx: 6 }, svg);
  const ot = el("text", { x: over, y: top - 10, "text-anchor": "middle", style: "fill:var(--muted);font-size:11px" }, svg);
  ot.textContent = "60분 안에 없음";
  rows.forEach((r, i) => {
    const cy = top + i * rowH + rowH / 2;
    const nm = el("text", { x: left - 14, y: cy + 4, "text-anchor": "end", class: "strong" }, svg);
    nm.textContent = r.name;
    // 목표선
    el("line", { x1: x(r.target), x2: x(r.target), y1: cy - 20, y2: cy + 20, stroke: "var(--target)", "stroke-width": 2 }, svg);
    const tl = el("text", { x: x(r.target) + 4, y: cy - 13, style: "fill:var(--muted);font-size:10.5px" }, svg);
    tl.textContent = "목표 " + r.targetLabel;
    const b = D.reach.before[r.key], a = D.reach.after[r.key];
    const bx = b.median == null ? over : x(b.median), ax = x(a.median);
    el("line", { x1: ax, x2: bx, y1: cy + 6, y2: cy + 6, stroke: "var(--axis)", "stroke-width": 2 }, svg);
    for (const [ver, obj, col] of [["before", b, "var(--before)"], ["after", a, "var(--after)"]]) {
      obj.values.forEach((v, j) => {
        const px = v == null ? over + (j - 5.5) * 3.2 : x(v);
        el("circle", { cx: px, cy: cy + 6, r: 3.2, fill: col, "fill-opacity": .35,
          "data-tip": `${ver === "after" ? AL : BL} · 시드 ${j + 1} · ${v == null ? "60분 안에 없음" : fmt(v)}` }, svg);
      });
    }
    el("circle", { cx: bx, cy: cy + 6, r: 7, fill: "var(--before)", stroke: "var(--surface)", "stroke-width": 2,
      "data-tip": `${BL} 중앙 · ${b.median == null ? "60분 안에 없음" + (r.rec ? ` (기록값 ${r.rec})` : "") : fmt(b.median)}` }, svg);
    el("circle", { cx: ax, cy: cy + 6, r: 7, fill: "var(--after)", stroke: "var(--surface)", "stroke-width": 2,
      "data-tip": `${AL} 중앙 · ${fmt(a.median)} (최악 ${fmt(a.worst)})` }, svg);
    const al = el("text", { x: ax, y: cy + 29, "text-anchor": "middle", style: "fill:var(--ink);font-weight:600;font-size:12px" }, svg);
    al.textContent = fmt(a.median);
    const bl = el("text", { x: bx, y: cy + 29, "text-anchor": "middle", style: "fill:var(--before);font-size:12px" }, svg);
    bl.textContent = b.median == null ? (r.rec ? `기록 ${r.rec}` : "없음") : fmt(b.median);
  });
  const ay = top + rows.length * rowH;
  el("line", { x1: left, x2: W - right, y1: ay, y2: ay, class: "axis" }, svg);
  const g = el("g", { class: "tick" }, svg);
  for (const t of ticks) { const tx = el("text", { x: x(t), y: ay + 19, "text-anchor": "middle" }, g); tx.textContent = fmt(t); }
  $("reach").appendChild(svg);
})();

// ── 반복 대 의미 ──
(function ratio() {
  const maxUp = Math.max(...["before", "after"].flatMap(v => D.grid[v].map(g => g.meaningful)));
  const maxDn = Math.max(...["before", "after"].flatMap(v => D.grid[v].map(g => g.ambient)));
  for (const ver of ["before", "after"]) {
    const W = 440, H = 250, left = 30, right = 8, top = 34, bottom = 26;
    const plotH = H - top - bottom;
    const zero = top + plotH * (maxUp / (maxUp + maxDn));
    const yu = (v) => zero - (v / maxUp) * (zero - top);
    const yd = (v) => zero + (v / maxDn) * (top + plotH - zero);
    const bw = (W - left - right) / 20;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": (ver === "after" ? AL : BL) + " 30초 칸별 반복 대 의미" });
    const d = D.lanes[ver];
    const t = el("text", { x: 0, y: 16, class: "panel-title" }, svg);
    const r = ver === "after" ? D.ledger.after.active[8][3] : D.ledger.before.active[8][3];
    t.textContent = (ver === "after" ? AL : BL) + ` — 반복:의미 ${r}`;
    const up = ver === "after" ? "var(--after)" : "var(--before)";
    const dn = ver === "after" ? "var(--after-soft)" : "var(--before-soft)";
    D.grid[ver].forEach((g, i) => {
      const bx = left + i * bw + 1, w = bw - 2;
      if (g.meaningful > 0) {
        const y = yu(g.meaningful);
        el("path", { d: `M${bx},${zero - 1} V${y + 3} q0,-3 3,-3 h${w - 6} q3,0 3,3 V${zero - 1} Z`, fill: up,
          "data-tip": `${fmt(g.from)}~${fmt(g.to)} · 의미 있는 사건 ${g.meaningful}건 (중앙)` }, svg);
      }
      if (g.ambient > 0) {
        const y = yd(g.ambient);
        el("path", { d: `M${bx},${zero + 1} V${y - 3} q0,3 3,3 h${w - 6} q3,0 3,-3 V${zero + 1} Z`, fill: dn,
          "data-tip": `${fmt(g.from)}~${fmt(g.to)} · 반복 사건 ${g.ambient}건 (중앙)` }, svg);
      }
    });
    el("line", { x1: left, x2: W - right, y1: zero, y2: zero, class: "axis" }, svg);
    const tk = el("g", { class: "tick" }, svg);
    [[maxUp, yu(maxUp)], [maxDn, yd(maxDn)]].forEach(([v, y]) => {
      el("line", { x1: left, x2: W - right, y1: y, y2: y, class: "gridline" }, svg);
      const tx = el("text", { x: left - 6, y: y + 4, "text-anchor": "end" }, tk); tx.textContent = v;
    });
    [0, 5, 10].forEach(m => {
      const tx = el("text", { x: left + (m * 2) * bw, y: H - 6, "text-anchor": m === 0 ? "start" : m === 10 ? "end" : "middle" }, tk);
      tx.textContent = m === 0 ? "0" : `${m}분`;
    });
    $("ratio-" + ver).appendChild(svg);
  }
})();

// ── 원장 표 ──
function renderLedger(mode) {
  const b = L("before", mode), a = L("after", mode);
  const head = `<thead><tr><th>축</th><th>창</th><th>목표</th><th class="num">${BL} 중앙</th><th class="num">${BL} 최악</th><th class="num">${AL} 중앙</th><th class="num">${AL} 최악</th><th>판정(${AL})</th></tr></thead>`;
  const body = a.map((row, i) => {
    const ok = row[5] === "✅";
    const v = `<span class="verdict ${ok ? "ok" : "no"}"><b>${ok ? "✓" : "✕"}</b>${ok ? "통과" : "미달"}</span>`;
    return `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td class="num was">${b[i][3]}</td><td class="num was">${b[i][4]}</td><td class="num">${row[3]}</td><td class="num">${row[4]}</td><td>${v}</td></tr>`;
  }).join("");
  $("ledger").innerHTML = head + "<tbody>" + body + "</tbody>";
  const passA = a.filter(r => r[5] === "✅").length, passB = b.filter(r => r[5] === "✅").length;
  $("ledger-note").textContent = `통과 ${passB}/${b.length} → ${passA}/${a.length}. ` +
    (mode === "active" ? (NARR.ledgerActive || "") : (NARR.ledgerIdle || ""));
}
function setMode(mode) {
  $("mode-active").setAttribute("aria-pressed", mode === "active");
  $("mode-idle").setAttribute("aria-pressed", mode === "idle");
  renderLedger(mode);
}
$("mode-active").addEventListener("click", () => setMode("active"));
$("mode-idle").addEventListener("click", () => setMode("idle"));
setMode("active");

// ── 치른 값 ──
const E = META.ending;
$("cost").innerHTML = `
  <div class="tile"><div class="k">엔딩까지 걸리는 시간</div>
    <div class="v"><span class="old">${E.before}</span><span class="arrow">→</span><span class="new">${E.after}</span></div>
    <div class="note">${E.note}</div></div>
  <div class="tile"><div class="k">10분 이후 가장 긴 무의미 구간(운영, 중앙)</div>
    <div class="v"><span class="old">${D.cliff.before.median}</span><span class="arrow">→</span><span class="new">${D.cliff.after.median}</span></div>
    <div class="note">중앙판에서 그 구간의 자리: ${D.cliff.before.where} → ${D.cliff.after.where}. ${NARR.cliff || ""}</div></div>`;

  const lomed = (xs) => { const v = xs.filter(n => n != null).sort((a, b) => a - b); return v.length ? v[(v.length - 1) >> 1] : null; };
