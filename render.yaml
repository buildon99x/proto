# Render Blueprint — 땅따먹기 온라인 세계 서버
#
# 이 저장소에서 Render 에 올라가는 것은 **게임 서버 하나뿐**이다.
# 런처와 각 프로젝트의 정적 빌드는 그대로 Vercel 에 남는다.
#
# 왜 서버만 따로 나가야 하는가
#   io 세계는 36만 칸을 메모리에 들고 초당 6회 도는 **권위 있는 프로세스 하나**를
#   필요로 한다. 서버리스 함수는 실행 시간 제한이 있고 다음 접속이 같은 인스턴스로
#   간다는 보장이 없어서, 같은 세계에 있다고 믿는 사람들이 서로 다른 세계에 앉는다.
#   자세한 근거는 projects/land-grab/docs/design/render-deploy.md
#
# 반드시 지켜야 할 것
#   - **인스턴스는 항상 1개.** 늘리는 순간 로드 밸런서가 접속을 갈라 세계가 쪼개진다.
#     Free / Starter 플랜은 애초에 수평 확장이 없어 기본값이 곧 1이다.
#     플랜을 올리더라도 오토스케일을 켜지 않는다.
#   - 상태는 전부 프로세스 메모리에 있다. 재배포하면 세계가 초기화된다.
#
# 적용: Render 대시보드 → Blueprints → 이 저장소 연결.

services:
  - type: web
    name: land-grab-server
    runtime: node
    # Free 인스턴스는 512MB / 0.1 CPU 이고 15분간 인바운드 트래픽이 없으면 잠든다.
    # 깨어나는 데 1분쯤 걸린다. 상시 가동이 필요해지면 starter 로 올린다.
    plan: free
    region: singapore
    # 첫 배포 확인을 위해 작업 브랜치를 가리킨다. `main` 에는 아직 server/ 도
    # 이 파일도 없다. main 에 병합하는 순간 이 값을 main 으로 되돌린다 —
    # 그러지 않으면 병합 뒤에도 서버가 계속 작업 브랜치를 따라간다.
    branch: claude/jolly-cray-7vb707
    healthCheckPath: /healthz

    # 워크스페이스 글롭이 projects/*/app 이라 server/ 는 pnpm 워크스페이스 밖이다.
    # 그래서 여기만 npm 으로 독립해서 설치한다. Vercel 빌드는 이 폴더를 보지 않는다.
    # --include=dev: 빌드에 esbuild 가 필요한데 NODE_ENV=production 이면 빠진다.
    buildCommand: cd projects/land-grab/server && npm ci --include=dev && npm run build
    startCommand: cd projects/land-grab/server && node dist/main.mjs

    # 시뮬레이션은 app/src/game 을 그대로 가져다 쓴다. 규칙이 바뀌면 서버도 다시 배포돼야 한다.
    buildFilter:
      paths:
        - render.yaml
        - projects/land-grab/server/**
        - projects/land-grab/app/src/game/**
        - projects/land-grab/app/src/net/**

    envVars:
      # 서버 코드는 Node 20 이상을 전제한다. server/.node-version 과 같은 값이다.
      - key: NODE_VERSION
        value: "20"
